# Environnement de développement : les dépendances de l'API et du worker.
#   make up     démarre tout (attend que les services soient prêts)
#   make down   arrête et supprime les données
name: go-api-skeleton

services:
  postgres:
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_USER: skeleton
      POSTGRES_PASSWORD: skeleton
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skeleton -d orders"]
      interval: 2s
      retries: 30

  nats:
    image: docker.io/nats:2.12-alpine
    # -js active JetStream ; -sd son stockage ; -m le port de supervision.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      retries: 30

  # Les traces OpenTelemetry (OTLP sur 4317 et 4318), consultables sur
  # http://localhost:16686.
  jaeger:
    image: docker.io/jaegertracing/jaeger:2.22.0
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  # Les applications elles-mêmes, construites depuis le Dockerfile. Elles ne
  # démarrent qu'avec le profil « apps » : make up ne lance que les
  # dépendances, pour développer avec go run ; docker compose --profile apps up
  # lance tout, comme en production.
  api:
    profiles: [apps]
    build: { context: ., args: { APP: api, PORT: "8080" } }
    environment: &app-env
      POSTGRES_URL: postgres://skeleton:skeleton@postgres:5432/orders?sslmode=disable
      NATS_URL: nats://nats:4222
    ports: ["8080:8080"]
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  worker:
    profiles: [apps]
    build: { context: ., args: { APP: worker, PORT: "8081" } }
    environment: *app-env
    ports: ["8081:8081"]
    depends_on: *app-deps

volumes:
  postgres:
  nats:
