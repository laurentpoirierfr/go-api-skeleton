# Configuration de sqlc : https://docs.sqlc.dev/en/latest/reference/config.html
# make generate régénère internal/adapters/postgres/db ; la CI vérifie que le
# code versionné est à jour.
version: "2"
sql:
  - engine: "postgresql"
    # sqlc lit les migrations (fichiers *.up.sql) pour connaître le schéma.
    schema: "internal/adapters/postgres/migrations"
    queries: "internal/adapters/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/adapters/postgres/db"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        output_files_suffix: ".gen"
        output_db_file_name: "db.gen.go"
        output_models_file_name: "models.gen.go"
        output_copyfrom_file_name: "copyfrom.gen.go"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
