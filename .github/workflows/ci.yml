# Intégration continue : formatage, analyse, tests avec le détecteur de
# courses, vulnérabilités et linters, à chaque push et pull request.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Format, analyse, tests et vulnérabilités
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatage (gofmt)
        run: |
          fichiers=$(gofmt -l .)
          if [ -n "$fichiers" ]; then
            echo "Fichiers à formater avec gofmt :"
            echo "$fichiers"
            exit 1
          fi

      - name: Analyse statique (go vet)
        run: go vet ./...

      - name: Tests, avec le détecteur de courses
        # Les tests d'intégration démarrent PostgreSQL avec Testcontainers :
        # Docker est disponible sur les machines ubuntu-latest.
        run: go test -race ./...

      - name: Vulnérabilités (govulncheck)
        run: go tool govulncheck ./...

  lint:
    name: Linters (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  images:
    name: Images Docker (api et worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Construit les deux images sans les publier : le Dockerfile reste valide
      # à chaque modification.
      - name: Construction
        run: make images VERSION=ci

  generated:
    name: Code généré à jour (sqlc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Régénération
        run: make generate
      - name: Aucune différence avec le code versionné
        run: |
          if ! git diff --exit-code; then
            echo "::error::Le code généré n'est pas à jour : lancez « make generate » et versionnez le résultat."
            exit 1
          fi
