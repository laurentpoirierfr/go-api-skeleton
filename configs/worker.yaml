# Configuration du binaire worker, pour le développement local (compose.yaml).
# Chaque clé est surchargeable par une variable d'environnement : http.address
# par HTTP_ADDRESS, postgres.url par POSTGRES_URL, etc. En production, passez
# les secrets (postgres.url) par l'environnement, jamais par ce fichier.
service:
  name: orders-worker

http:
  address: ":8081"

postgres:
  url: postgres://skeleton:skeleton@localhost:5432/orders?sslmode=disable
  max_conns: 10
  auto_migrate: true # en production : false, et migrations lancées à part

nats:
  url: nats://localhost:4222

log:
  level: info
  format: text # json en production

shutdown:
  timeout: 15s

# La consommation des événements : quelques essais rapides dans le processus,
# puis des relivraisons espacées ; au-delà de max_deliveries, la DLQ.
consumer:
  max_deliveries: 5
  ack_wait: 30s
  retries: 3
  retry_interval: 100ms
  backoff: [1s, 5s, 30s, 2m]
